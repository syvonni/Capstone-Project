
services:
  # MongoDB Database (IAS-3.7: auth + least-privilege app user)
  mongodb:
    image: mongo:7.0
    container_name: capstone-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: capstone_project
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-devrootpass}
      MONGO_APP_USER: ${MONGO_APP_USER:-capstone_app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-devapppass}
    volumes:
      - mongodb_data:/data/db
      - ./deploy/mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'db.adminCommand(\"ping\")' && exit 0 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # IPFS Node
  ipfs:
    image: ipfs/kubo:latest
    container_name: capstone-ipfs
    ports:
      - "4001:4001"   # Swarm
      - "5001:5001"   # API
      - "8080:8080"   # Gateway
    volumes:
      - ipfs_data:/data/ipfs
    environment:
      - IPFS_PROFILE=server
    healthcheck:
      test: ["CMD", "ipfs", "version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s

  # Wait for core services (mongodb, ipfs)
  wait-for-services:
    image: alpine:latest
    depends_on:
      mongodb:
        condition: service_healthy
      ipfs:
        condition: service_healthy
    command: >
      sh -c "
        echo 'All dependent services are healthy and ready!' &&
        exit 0
      "

  # Auth Service
  auth-service:
    build:
      context: ./backend
      dockerfile: services/auth-service/Dockerfile
    container_name: capstone-auth-service
    ports:
      - "3001:3001"
    depends_on:
      mongodb:
        condition: service_healthy
      ipfs:
        condition: service_healthy
    env_file: .env
    environment:
      - MONGO_URI=mongodb://${MONGO_APP_USER:-capstone_app}:${MONGO_APP_PASSWORD:-devapppass}@mongodb:27017/capstone_project?authSource=admin
      - IPFS_API_URL=${DOCKER_IPFS_API_URL}
      - IPFS_GATEWAY_URL=${DOCKER_IPFS_GATEWAY_URL}
      - AUDIT_SERVICE_URL=${DOCKER_AUDIT_SERVICE_URL}
      - ADMIN_SERVICE_URL=${DOCKER_ADMIN_SERVICE_URL}
      - BUSINESS_SERVICE_URL=${DOCKER_BUSINESS_SERVICE_URL}
      - SEED_DEV=true
      - SEED_TEMP_PASSWORD=${SEED_TEMP_PASSWORD:-TempPass123!}
      - EMAIL_DEV_REDIRECT_TO=${EMAIL_DEV_REDIRECT_TO:-}
      - DEV_EMAIL_OFFICER=${DEV_EMAIL_OFFICER:-}
      - DEV_EMAIL_OFFICER2=${DEV_EMAIL_OFFICER2:-}
      - DEV_EMAIL_MANAGER=${DEV_EMAIL_MANAGER:-}
      - DEV_EMAIL_ADMIN=${DEV_EMAIL_ADMIN:-}
      - DEV_EMAIL_ADMIN2=${DEV_EMAIL_ADMIN2:-}
      - DEV_EMAIL_ADMIN3=${DEV_EMAIL_ADMIN3:-}
      - DEV_EMAIL_INSPECTOR=${DEV_EMAIL_INSPECTOR:-}
      - DEV_EMAIL_CSO=${DEV_EMAIL_CSO:-}
      - DEV_EMAIL_BUSINESS=${DEV_EMAIL_BUSINESS:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Business Service
  business-service:
    build:
      context: ./backend
      dockerfile: services/business-service/Dockerfile
    container_name: capstone-business-service
    ports:
      - "3002:3002"
    depends_on:
      mongodb:
        condition: service_healthy
      ipfs:
        condition: service_healthy
    env_file: .env
    environment:
      - MONGO_URI=mongodb://${MONGO_APP_USER:-capstone_app}:${MONGO_APP_PASSWORD:-devapppass}@mongodb:27017/capstone_project?authSource=admin
      - IPFS_API_URL=${DOCKER_IPFS_API_URL}
      - IPFS_GATEWAY_URL=${DOCKER_IPFS_GATEWAY_URL}
      - AUDIT_SERVICE_URL=${DOCKER_AUDIT_SERVICE_URL}
      - AUTH_SERVICE_URL=${DOCKER_AUTH_SERVICE_URL}
      - SEED_FEE_CONFIGURATION=true
      - EMAIL_API_PROVIDER=${EMAIL_API_PROVIDER:-}
      - EMAIL_API_KEY=${EMAIL_API_KEY:-}
      - EMAIL_API_URL=${EMAIL_API_URL:-}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-}
      - EMAIL_DEV_REDIRECT_TO=${EMAIL_DEV_REDIRECT_TO:-}
      - DISABLE_EMAIL_NOTIFICATIONS=${DISABLE_EMAIL_NOTIFICATIONS:-false}
    restart: unless-stopped

  # Admin Service
  admin-service:
    build:
      context: ./backend
      dockerfile: services/admin-service/Dockerfile
    container_name: capstone-admin-service
    ports:
      - "3003:3003"
    depends_on:
      mongodb:
        condition: service_healthy
    env_file: .env
    environment:
      - MONGO_URI=mongodb://${MONGO_APP_USER:-capstone_app}:${MONGO_APP_PASSWORD:-devapppass}@mongodb:27017/capstone_project?authSource=admin
      - AUTH_SERVICE_URL=${DOCKER_AUTH_SERVICE_URL}
      - AUDIT_SERVICE_URL=${DOCKER_AUDIT_SERVICE_URL}
      - BUSINESS_SERVICE_URL=${DOCKER_BUSINESS_SERVICE_URL}
      - SEED_FORM_DEFINITIONS=true
      - SEED_PERMIT_FORMS=true
      - SEED_DEV=true
    restart: unless-stopped

  # Audit Service
  audit-service:
    build:
      context: ./backend
      dockerfile: services/audit-service/Dockerfile
    container_name: capstone-audit-service
    ports:
      - "3004:3004"
    depends_on:
      - mongodb
    env_file: .env
    environment:
      - MONGO_URI=mongodb://${MONGO_APP_USER:-capstone_app}:${MONGO_APP_PASSWORD:-devapppass}@mongodb:27017/capstone_project?authSource=admin
      - ADMIN_SERVICE_URL=${DOCKER_ADMIN_SERVICE_URL}
    restart: unless-stopped

  # Dozzle - Live log viewer for all containers (open in browser for POST/GET/fetch logs)
  dozzle:
    image: amir20/dozzle:latest
    container_name: capstone-dozzle
    ports:
      - "9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  mongodb_data:
  ipfs_data:
